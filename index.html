<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to Open Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f3ff;
      padding: 40px 20px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      margin: 30px auto;
      box-shadow: 0 4px 15px #0001;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 25px auto;
    }

    a {
      color: #6d28d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome!</h1>
    <p>Scan this QR code to open the menu website.</p>

    <div id="qrcode"></div>

    <p>
      <a href="./main.html">Or click here to open the menu directly website</a>
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const mainPageURL = new URL("main.html", window.location.href).href;

    new QRCode(document.getElementById("qrcode"), {
      text: mainPageURL,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
